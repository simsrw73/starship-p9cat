"$schema" = 'https://starship.rs/config-schema.json'

# p9cat — classic powerlevel9k layout in Catppuccin colors.
# Flavor: change `palette` to catppuccin_latte, _frappe, _macchiato or _mocha.
# Requires a Nerd Font. Glyphs are written as \u escapes so the file stays
# readable in any editor.

add_newline = true
palette = "catppuccin_mocha"

# Line 1: left segments, $fill, right segments. Line 2: the prompt character.
# (right_format only ever aligns with the last line, so $fill does the work.)
format = """
[ ](bg:crust)$os[ ](fg:overlay0 bg:crust)\
$directory\
$git_branch$git_commit$git_state$git_status\
[](fg:crust)\
$fill\
[](fg:crust)$username$hostname[ ](fg:overlay0 bg:crust)\
$time
$character"""

[os]
disabled = false
style = "fg:sapphire bg:crust"
format = "[$symbol]($style)"

[os.symbols]
Windows = ""
Linux = ""
Macos = ""
Ubuntu = ""
Debian = ""
Arch = ""
Fedora = ""
Alpine = ""
Mint = ""
Manjaro = ""
NixOS = ""
openSUSE = ""
Raspbian = ""
FreeBSD = ""
Unknown = ""

[directory]
style = "fg:sapphire bg:crust"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = " "
read_only_style = "fg:red bg:crust"
truncation_length = 100
truncate_to_repo = false
home_symbol = "~"

[git_branch]
symbol = " "
style = "fg:green bg:crust"
format = "[ ](fg:overlay0 bg:crust)[$symbol$branch ]($style)"

[git_commit]
only_detached = true
tag_disabled = false
tag_symbol = "  "
style = "fg:green bg:crust"
format = "[ ](fg:overlay0 bg:crust)[ $hash$tag ]($style)"

[git_state]
style = "fg:peach bg:crust"
format = "[$state( $progress_current/$progress_total) ]($style)"

[git_status]
style = "bg:crust"
format = "([$ahead_behind$conflicted$staged$modified$renamed$deleted$untracked$stashed]($style))"
ahead = "[↑${count} ](fg:green bg:crust)"
behind = "[↓${count} ](fg:green bg:crust)"
diverged = "[↑${ahead_count} ↓${behind_count} ](fg:green bg:crust)"
up_to_date = "[≡ ](fg:green bg:crust)"
conflicted = "[=${count} ](fg:red bg:crust)"
staged = "[+${count} ](fg:yellow bg:crust)"
modified = "[!${count} ](fg:yellow bg:crust)"
renamed = "[»${count} ](fg:yellow bg:crust)"
deleted = "[✘${count} ](fg:yellow bg:crust)"
untracked = "[?${count} ](fg:sky bg:crust)"
stashed = "[*${count} ](fg:maroon bg:crust)"

[fill]
symbol = " "
style = ""

[username]
show_always = true
style_user = "fg:yellow bg:crust"
style_root = "fg:red bg:crust"
format = "[ $user]($style)"

[hostname]
ssh_only = false
style = "fg:yellow bg:crust"
format = "[@$hostname]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:teal bg:crust"
format = "[ $time   ]($style)"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

